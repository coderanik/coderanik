<div id="ti-wrap" style="background:#0b0e14;border:1px solid #2a3038;border-radius:12px;overflow:hidden;font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;color:#c9d1d9;max-width:900px;margin:0 auto;">
  <div style="height:34px;background:#161b22;border-bottom:1px solid #2a3038;display:flex;align-items:center;padding:0 14px;position:relative;">
    <span style="width:12px;height:12px;border-radius:50%;background:#ff5f56;display:inline-block;margin-right:8px;"></span>
    <span style="width:12px;height:12px;border-radius:50%;background:#ffbd2e;display:inline-block;margin-right:8px;"></span>
    <span style="width:12px;height:12px;border-radius:50%;background:#27c93f;display:inline-block;"></span>
    <span style="position:absolute;left:50%;transform:translateX(-50%);font-size:12.5px;color:#8b949e;">coderanik@github: ~$ ./invaders.sh --play</span>
  </div>

  <div style="position:relative;">
    <canvas id="ti-canvas" width="860" height="480" style="display:block;width:100%;height:auto;background:#0b0e14;"></canvas>

    <div id="ti-hud" style="position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:13px;color:#8b949e;pointer-events:none;">
      <span>SCORE <span id="ti-score" style="color:#c9d1d9;">0000</span></span>
      <span id="ti-wave">WAVE 1</span>
      <span>LIVES <span id="ti-lives" style="color:#58a6ff;">▲▲▲</span></span>
    </div>

    <div id="ti-overlay" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(11,14,20,0.88);text-align:center;">
      <div style="font-size:22px;letter-spacing:2px;color:#c9d1d9;margin-bottom:6px;">./INVADERS.SH</div>
      <div style="font-size:12.5px;color:#8b949e;margin-bottom:18px;max-width:340px;">clear the contribution grid before the aliens reach your ship</div>
      <button id="ti-start" style="font-family:inherit;font-size:13px;background:#161b22;color:#27c93f;border:1px solid #2a3038;border-radius:6px;padding:10px 22px;cursor:pointer;">▶ press to start</button>
      <div style="font-size:11px;color:#586069;margin-top:16px;">← → or A/D to move · SPACE to fire · P to pause</div>
    </div>
  </div>

  <div style="height:24px;border-top:1px solid #2a3038;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;">
    <span style="font-size:10px;color:#8b949e;opacity:0.42;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:600;letter-spacing:0.3px;">gitskins.com</span>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('ti-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('ti-score');
  const livesEl = document.getElementById('ti-lives');
  const waveEl = document.getElementById('ti-wave');
  const overlay = document.getElementById('ti-overlay');
  const startBtn = document.getElementById('ti-start');

  const GREEN = '#2ea043', GREEN_LIGHT = '#7ee787', AMBER = '#d29922', AMBER_LIGHT = '#e3b341', BLUE = '#58a6ff', DIM = '#30363d';

  let stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.4+0.3, tw: Math.random()*Math.PI*2});
  }

  let state = 'idle'; // idle | playing | paused | over | win
  let score = 0, lives = 3, wave = 1;
  let keys = {};

  const shipW = 26, shipH = 16;
  let ship = { x: W/2 - shipW/2, y: H - 46, cooldown: 0 };
  let bullets = []; // player bullets
  let bombs = [];   // alien bombs
  let particles = [];

  const cols = 14, rows = 5, cellW = 44, cellH = 28;
  const gridLeft = (W - cols*cellW)/2, gridTop = 60;
  let aliens = [];
  let dir = 1, stepTimer = 0, stepInterval = 42, dropFlag = false;

  function buildWave(){
    aliens = [];
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const elite = (r === 2 && (c % 5 === 2));
        aliens.push({
          c, r,
          x: gridLeft + c*cellW,
          y: gridTop + r*cellH,
          alive: true,
          elite,
          glow: Math.random()
        });
      }
    }
    stepInterval = Math.max(14, 42 - (wave-1)*5);
  }

  function resetGame(){
    score = 0; lives = 3; wave = 1;
    ship.x = W/2 - shipW/2;
    bullets = []; bombs = []; particles = [];
    dir = 1; stepTimer = 0; dropFlag = false;
    buildWave();
    updateHud();
  }

  function updateHud(){
    scoreEl.textContent = String(score).padStart(4,'0');
    livesEl.textContent = '▲'.repeat(Math.max(lives,0)) + '·'.repeat(Math.max(3-lives,0));
    waveEl.textContent = 'WAVE ' + wave;
  }

  function aliveAliens(){ return aliens.filter(a => a.alive); }

  function spawnExplosion(x,y,color){
    for (let i=0;i<10;i++){
      particles.push({x,y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:22,color});
    }
  }

  function endGame(win){
    state = win ? 'win' : 'over';
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <div style="font-size:22px;letter-spacing:2px;color:${win? '#7ee787':'#ff7b72'};margin-bottom:6px;">${win ? 'GRID CLEARED' : 'CONNECTION LOST'}</div>
      <div style="font-size:12.5px;color:#8b949e;margin-bottom:18px;">final score ${String(score).padStart(4,'0')} — wave ${wave}</div>
      <button id="ti-restart" style="font-family:inherit;font-size:13px;background:#161b22;color:#27c93f;border:1px solid #2a3038;border-radius:6px;padding:10px 22px;cursor:pointer;">↻ play again</button>
    `;
    document.getElementById('ti-restart').onclick = () => {
      resetGame();
      overlay.style.display = 'none';
      state = 'playing';
    };
  }

  function update(){
    if (state !== 'playing') return;

    // ship movement
    const speed = 4.6;
    if ((keys['arrowleft'] || keys['a']) && ship.x > 8) ship.x -= speed;
    if ((keys['arrowright'] || keys['d']) && ship.x < W - shipW - 8) ship.x += speed;
    if (ship.cooldown > 0) ship.cooldown--;
    if (keys[' '] && ship.cooldown === 0){
      bullets.push({x: ship.x + shipW/2 - 1.5, y: ship.y - 6});
      ship.cooldown = 14;
    }

    // bullets
    bullets.forEach(b => b.y -= 7);
    bullets = bullets.filter(b => b.y > -10);

    // alien march
    stepTimer++;
    if (stepTimer >= stepInterval){
      stepTimer = 0;
      let edgeHit = false;
      aliveAliens().forEach(a => {
        const nx = a.x + dir*10;
        if (nx < 6 || nx > W - cellW - 6) edgeHit = true;
      });
      if (edgeHit){
        dir *= -1;
        aliveAliens().forEach(a => a.y += 14);
      } else {
        aliveAliens().forEach(a => a.x += dir*10);
      }
      // random alien bomb
      const shooters = aliveAliens();
      if (shooters.length && Math.random() < 0.55){
        const s = shooters[Math.floor(Math.random()*shooters.length)];
        bombs.push({x: s.x + cellW/2 - 1.5, y: s.y + 20});
      }
    }

    // bombs
    bombs.forEach(b => b.y += 3.4);
    bombs = bombs.filter(b => b.y < H + 10);

    // bullet vs alien
    bullets.forEach(b => {
      aliveAliens().forEach(a => {
        if (a.alive && b.x > a.x-2 && b.x < a.x+cellW-14 && b.y > a.y-2 && b.y < a.y+16){
          a.alive = false;
          b.hit = true;
          score += a.elite ? 25 : 10;
          spawnExplosion(a.x+14, a.y+8, a.elite ? AMBER_LIGHT : GREEN_LIGHT);
          updateHud();
        }
      });
    });
    bullets = bullets.filter(b => !b.hit);

    // bomb vs ship
    bombs.forEach(b => {
      if (!b.hit && b.x > ship.x-2 && b.x < ship.x+shipW && b.y > ship.y-4 && b.y < ship.y+shipH){
        b.hit = true;
        lives--;
        spawnExplosion(ship.x+shipW/2, ship.y+shipH/2, '#ff7b72');
        updateHud();
        if (lives <= 0){ endGame(false); }
      }
    });
    bombs = bombs.filter(b => !b.hit);

    // aliens reach ship
    if (aliveAliens().some(a => a.y + cellH > ship.y)) endGame(false);

    // wave clear
    if (aliveAliens().length === 0){
      wave++;
      buildWave();
      bombs = [];
      updateHud();
    }

    // particles
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
    particles = particles.filter(p => p.life > 0);
  }

  function drawStars(t){
    stars.forEach(s => {
      const a = 0.35 + 0.35*Math.sin(t/600 + s.tw);
      ctx.fillStyle = `rgba(201,209,217,${a.toFixed(2)})`;
      ctx.fillRect(s.x, s.y, s.r, s.r);
    });
  }

  function drawAlien(a){
    const color = a.elite ? (a.glow > 0.5 ? AMBER_LIGHT : AMBER) : (a.glow > 0.75 ? GREEN_LIGHT : GREEN);
    ctx.fillStyle = color;
    // simple 3x2 block invader glyph
    const bx = a.x, by = a.y;
    ctx.fillRect(bx+6, by, 16, 6);
    ctx.fillRect(bx, by+6, 28, 8);
    ctx.fillRect(bx+2, by+14, 6, 4);
    ctx.fillRect(bx+20, by+14, 6, 4);
  }

  function drawShip(){
    ctx.fillStyle = BLUE;
    ctx.beginPath();
    ctx.moveTo(ship.x+shipW/2, ship.y);
    ctx.lineTo(ship.x+shipW, ship.y+shipH);
    ctx.lineTo(ship.x+shipW/2+4, ship.y+shipH-4);
    ctx.lineTo(ship.x+shipW/2-4, ship.y+shipH-4);
    ctx.lineTo(ship.x, ship.y+shipH);
    ctx.closePath();
    ctx.fill();
  }

  function draw(t){
    ctx.clearRect(0,0,W,H);
    drawStars(t);

    aliveAliens().forEach(drawAlien);

    ctx.fillStyle = AMBER_LIGHT;
    bombs.forEach(b => ctx.fillRect(b.x, b.y, 3, 10));

    ctx.fillStyle = '#a5d6ff';
    bullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 10));

    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(p.life/22, 0);
      ctx.fillRect(p.x, p.y, 2.5, 2.5);
      ctx.globalAlpha = 1;
    });

    if (state === 'playing' || state === 'paused') drawShip();

    if (state === 'paused'){
      ctx.fillStyle = 'rgba(11,14,20,0.55)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#c9d1d9';
      ctx.font = '16px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED — press P to resume', W/2, H/2);
    }
  }

  function loop(t){
    update();
    draw(t);
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === 'p' && (state === 'playing' || state === 'paused')){
      state = state === 'playing' ? 'paused' : 'playing';
    }
    if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  startBtn.addEventListener('click', () => {
    resetGame();
    overlay.style.display = 'none';
    state = 'playing';
    canvas.focus();
  });

  buildWave();
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
